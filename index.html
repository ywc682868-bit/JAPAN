<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奶油雜貨店 - 日本連線</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
      }
    }
  </script>
</head>
<body class="bg-[#EFECE9] min-h-screen font-sans text-[#4A4543] antialiased pb-12">

  <header class="bg-[#F8F6F4] border-b border-[#D5D0CC] shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#B08889]/20 rounded-xl flex items-center justify-center text-[#B08889]">
          <i class="fa-solid fa-cookie-bite text-lg"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-wide text-[#4A4543]">奶油雜貨店 Butter Variety Store</h1>
      </div>
      <a href="manager.html" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-[#E2DEDA] hover:bg-[#D5D0CC] text-[#4A4543] transition-all flex items-center gap-1.5" title="管理登入">
        <i class="fa-solid fa-lock text-[#7A726E]"></i> 管理後台
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">
    <div id="connection-status" class="mb-6 p-3.5 rounded-2xl text-xs font-medium bg-[#8F9E93]/15 text-[#4E5C53] border border-[#8F9E93]/30 flex items-center">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i> 連線資料庫中...
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-xl font-bold text-[#4A4543] flex items-center gap-2">
          <i class="fa-solid fa-gift text-[#B08889]"></i> 商品目錄
        </h2>
        <div id="customer-product-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>

      <div class="lg:col-span-1">
        <div class="bg-[#F8F6F4] rounded-3xl shadow-sm border border-[#D5D0CC] p-5 sticky top-24 space-y-4">
          <h3 class="text-lg font-bold text-[#4A4543] border-b border-[#EFECE9] pb-3 flex justify-between items-center">
            <span class="flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-[#B08889]"></i>您的選購清單</span>
            <span id="cart-item-count" class="text-xs bg-[#B08889]/20 text-[#6B4B4C] px-2.5 py-1 rounded-full font-bold">0 件</span>
          </h3>
          <div id="cart-items-list" class="space-y-2 max-h-60 overflow-y-auto divide-y divide-[#EFECE9] text-sm">
            <p class="text-[#A39E9A] text-center py-6 text-xs">尚未選擇商品</p>
          </div>
          <form onsubmit="submitCustomerOrder(event)" class="space-y-3.5 pt-3 border-t border-[#EFECE9]">
            <div>
              <label class="block text-xs font-semibold text-[#7A726E] mb-1">喊單平台</label>
              <select id="cust-platform" class="w-full text-sm p-2.5 bg-white border border-[#D5D0CC] rounded-xl focus:ring-2 focus:ring-[#B08889] focus:outline-none">
                <option value="LINE">LINE</option>
                <option value="Threads">Threads</option>
                <option value="IG">Instagram</option>
                <option value="FB">Facebook</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#7A726E] mb-1">買家暱稱 / ID <span class="text-rose-500">*</span></label>
              <input type="text" id="cust-name" required placeholder="例如：Annn" class="w-full text-sm p-2.5 bg-white border border-[#D5D0CC] rounded-xl focus:ring-2 focus
