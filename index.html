<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奶油雜貨店 - 管理後台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <style>
    body { background-color: #EFECE9 !important; color: #4A4543 !important; }
    .bg-morandi-card { background-color: #F8F6F4 !important; }
    .bg-rose-pink { background-color: #B08889 !important; }
    .bg-sage-green { background-color: #8F9E93 !important; }
    .text-morandi-pink { color: #B08889 !important; }
    .text-morandi-dark { color: #4A4543 !important; }
    .text-morandi-sub { color: #7A726E !important; }
    .border-morandi { border-color: #D5D0CC !important; }
    
    .bg-\[\#EFECE9\] { background-color: #EFECE9 !important; }
    .bg-\[\#F8F6F4\] { background-color: #F8F6F4 !important; }
    .bg-\[\#B08889\] { background-color: #B08889 !important; }
    .bg-\[\#8F9E93\] { background-color: #8F9E93 !important; }
    .bg-\[\#E2DEDA\] { background-color: #E2DEDA !important; }
    .text-\[\#4A4543\] { color: #4A4543 !important; }
    .text-\[\#B08889\] { color: #B08889 !important; }
    .text-\[\#7A726E\] { color: #7A726E !important; }
    .text-\[\#A39E9A\] { color: #A39E9A !important; }
    .border-\[\#D5D0CC\] { border-color: #D5D0CC !important; }
    .border-\[\#EFECE9\] { border-color: #EFECE9 !important; }

    /* 手機模式滾動優化 */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      }
    }
  </script>
</head>
<body class="bg-[#EFECE9] min-h-screen font-sans text-[#4A4543] antialiased pb-12">

  <!-- 登入遮罩 -->
  <div id="auth-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-80 z-50 flex items-center justify-center p-4">
    <div class="bg-[#F8F6F4] p-6 sm:p-8 rounded-3xl shadow-xl max-w-sm w-full space-y-5 text-center border border-[#D5D0CC]">
      <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto text-[#B08889]" style="background-color: rgba(176, 136, 137, 0.2);">
        <i class="fa-solid fa-tree text-2xl"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-[#4A4543]">管理員安全登入</h2>
        <p class="text-xs text-[#7A726E] mt-1">請輸入後台管理帳號</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
        <div>
          <label class="block text-xs font-semibold text-[#7A726E] mb-1">管理員 Email</label>
          <input type="email" id="admin-email" required placeholder="admin@butter.com" class="w-full p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#7A726E] mb-1">密碼</label>
          <input type="password" id="admin-password" required placeholder="••••••••" class="w-full p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-[#B08889] text-white font-bold rounded-xl shadow-sm transition-all">登入後台</button>
      </form>
      <p id="login-error" class="text-xs text-red-500 font-medium"></p>
    </div>
  </div>

  <div id="admin-content" class="hidden max-w-6xl mx-auto px-3 sm:px-4 mt-4 sm:mt-6 space-y-4 sm:space-y-6">
    <header class="bg-[#F8F6F4] p-4 sm:p-5 rounded-2xl shadow-sm flex justify-between items-center border border-[#D5D0CC]">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center text-[#8F9E93]" style="background-color: rgba(143, 158, 147, 0.2);">
          <i class="fa-solid fa-cookie-bite text-base sm:text-lg"></i>
        </div>
        <h1 class="text-lg sm:text-xl font-bold text-[#4A4543]">奶油雜貨店 · 管理後台</h1>
      </div>
      <button onclick="handleLogout()" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-[#E2DEDA] text-[#4A4543] text-xs font-bold rounded-xl transition-all whitespace-nowrap">登出</button>
    </header>

    <!-- 標籤導覽 -->
    <div class="flex border border-[#D5D0CC] bg-[#F8F6F4] rounded-2xl overflow-x-auto scrollbar-none shadow-sm p-1 gap-1">
      <button onclick="switchTab('procurement')" id="tab-btn-procurement" class="flex-1 min-w-[90px] py-2 sm:py-2.5 font-bold text-xs sm:text-sm bg-[#B08889] text-white rounded-xl transition-all whitespace-nowrap">採購與庫存統計</button>
      <button onclick="switchTab('queue')" id="tab-btn-queue" class="flex-1 min-w-[90px] py-2 sm:py-2.5 font-bold text-xs sm:text-sm text-[#7A726E] hover:bg-[#EFECE9] rounded-xl transition-all whitespace-nowrap">排隊清單</button>
      <button onclick="switchTab('products')" id="tab-btn-products" class="flex-1 min-w-[90px] py-2 sm:py-2.5 font-bold text-xs sm:text-sm text-[#7A726E] hover:bg-[#EFECE9] rounded-xl transition-all whitespace-nowrap">商品管理</button>
    </div>

    <!-- 1. 採購與庫存統計表 -->
    <div id="tab-procurement" class="bg-[#F8F6F4] rounded-2xl shadow-sm border border-[#D5D0CC] p-3 sm:p-6 space-y-3 sm:space-y-4">
      <div class="flex justify-between items-center flex-wrap gap-2.5 border-b border-[#EFECE9] pb-3">
        <div>
          <h3 class="font-bold text-[#4A4543] text-sm sm:text-base flex items-center gap-1.5">
            <i class="fa-solid fa-list-check text-[#B08889]"></i>採購與現貨庫存清單
          </h3>
          <p class="text-[11px] text-[#7A726E] mt-0.5">現貨庫存若未填或為 0，前台將直接視同無現貨（已完售）；可上下拖曳調整品項順序。</p>
        </div>
        
        <div class="flex items-center gap-1.5 sm:gap-2 bg-[#EFECE9] p-1.5 rounded-xl text-xs w-full sm:w-auto justify-between sm:justify-start">
          <div class="flex items-center gap-1">
            <span class="text-[#7A726E] font-medium">貨幣：</span>
            <input type="text" id="currency-symbol" value="JP¥" oninput="renderProcurement()" class="w-12 sm:w-14 p-1 bg-white border border-[#D5D0CC] rounded-lg font-bold text-center">
          </div>
          <div class="flex items-center gap-1">
            <span class="text-[#7A726E] font-medium pl-1">匯率：</span>
            <input type="number" id="currency-rate" value="0.21" step="0.001" oninput="renderProcurement()" class="w-16 sm:w-16 p-1 bg-white border border-[#D5D0CC] rounded-lg font-bold text-center">
          </div>
        </div>
      </div>

      <!-- 採購統計分類篩選器 -->
      <div class="flex items-center gap-2 flex-wrap bg-[#EFECE9] p-3 rounded-2xl">
        <span class="text-xs font-bold text-[#7A726E]">篩選顯示分類：</span>
        <div id="procurement-category-filters" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div class="overflow-x-auto -mx-3 sm:mx-0">
        <table class="w-full text-left text-xs sm:text-sm min-w-[780px] sm:min-w-full">
          <thead>
            <tr class="bg-[#EFECE9] border-b border-[#D5D0CC] text-xs text-[#7A726E]">
              <th class="p-2 sm:p-3 w-8 text-center"></th>
              <th class="p-2 sm:p-3 w-10 text-center">已購</th>
              <th class="p-2 sm:p-3">商品名稱 / 類別</th>
              <th class="p-2 sm:p-3">規格 / 金額</th>
              <th class="p-2 sm:p-3 text-right whitespace-nowrap">需求總數</th>
              <th class="p-2 sm:p-3 text-right whitespace-nowrap">現貨庫存</th>
              <th class="p-2 sm:p-3 text-right whitespace-nowrap">已採購數</th>
              <th class="p-2 sm:p-3 text-right whitespace-nowrap">單價 (<span class="header-curr-label">JP¥</span>)</th>
              <th class="p-2 sm:p-3 text-right rounded-r-xl whitespace-nowrap">小計 (<span class="header-curr-label">JP¥</span>)</th>
            </tr>
          </thead>
          <tbody id="procurement-tbody" class="divide-y divide-[#EFECE9]"></tbody>
          <tfoot>
            <tr class="bg-[#EFECE9] font-bold border-t-2 border-[#D5D0CC]">
              <td colspan="8" class="p-2.5 sm:p-3 text-right text-[#7A726E] rounded-l-xl whitespace-nowrap">採購總計金額：</td>
              <td id="procurement-local-total" class="p-2.5 sm:p-3 text-right text-[#B08889] text-sm sm:text-base font-black whitespace-nowrap">JP¥ 0</td>
            </tr>
            <tr class="bg-[#FAF9F7] font-bold text-xs text-[#7A726E]">
              <td colspan="8" class="p-2.5 sm:p-3 text-right rounded-l-xl whitespace-nowrap">當地貨幣估算台幣總額 (NT$)：</td>
              <td id="procurement-twd-total" class="p-2.5 sm:p-3 text-right text-[#8F9E93] text-xs sm:text-sm font-black whitespace-nowrap">NT$ 0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- 2. 排隊出貨清單 -->
    <div id="tab-queue" class="hidden bg-[#F8F6F4] rounded-2xl shadow-sm border border-[#D5D0CC] p-3 sm:p-6 space-y-3 sm:space-y-4">
      <div class="flex justify-between items-center flex-wrap gap-2">
        <div>
          <h3 class="font-bold text-[#4A4543] text-sm sm:text-base flex items-center gap-1.5">
            <i class="fa-solid fa-clock-rotate-left text-[#8F9E93]"></i>依下單順序自動配貨清單
          </h3>
        </div>
        <button onclick="exportToExcel()" class="w-full sm:w-auto px-3 py-2 bg-[#8F9E93] text-white text-xs font-bold rounded-xl shadow-sm flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-file-excel text-sm"></i> 下載出貨清單 (Excel)
        </button>
      </div>
      <div class="overflow-x-auto -mx-3 sm:mx-0">
        <table class="w-full text-left text-xs sm:text-sm min-w-[680px] sm:min-w-full">
          <thead>
            <tr class="bg-[#EFECE9] border-b border-[#D5D0CC] text-xs text-[#7A726E]">
              <th class="p-2 sm:p-3 w-12 text-center rounded-l-xl">順位</th>
              <th class="p-2 sm:p-3">時間</th>
              <th class="p-2 sm:p-3">平台</th>
              <th class="p-2 sm:p-3">買家/收件人</th>
              <th class="p-2 sm:p-3">明細與收件資訊</th>
              <th class="p-2 sm:p-3 text-right whitespace-nowrap">金額</th>
              <th class="p-2 sm:p-3 text-center rounded-r-xl">刪除</th>
            </tr>
          </thead>
          <tbody id="queue-tbody" class="divide-y divide-[#EFECE9]"></tbody>
          <tfoot>
            <tr class="bg-[#EFECE9] font-bold border-t-2 border-[#D5D0CC]">
              <td colspan="5" class="p-2.5 sm:p-3 text-right text-[#7A726E] rounded-l-xl whitespace-nowrap">所有訂單實配總計金額：</td>
              <td id="queue-grand-total" class="p-2.5 sm:p-3 text-right text-[#B08889] text-sm sm:text-base font-black whitespace-nowrap">NT$ 0</td>
              <td class="p-2.5 sm:p-3 rounded-r-xl"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- 3. 商品管理 -->
    <div id="tab-products" class="hidden bg-[#F8F6F4] rounded-2xl shadow-sm border border-[#D5D0CC] p-3 sm:p-6 space-y-4 sm:space-y-6">
      <div class="border border-[#D5D0CC] p-4 sm:p-5 rounded-2xl bg-[#FAF9F7] space-y-3 sm:space-y-4">
        <h3 id="form-title" class="font-bold text-[#4A4543] text-sm sm:text-base flex items-center gap-2"><i class="fa-solid fa-gift text-[#B08889]"></i>新增上架商品</h3>
        
        <form onsubmit="saveProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-3 items-center">
          <input type="hidden" id="edit-id">
          <input type="text" id="p-name" required placeholder="商品名稱" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:outline-none">
          <input type="text" id="p-spec" placeholder="規格/顏色" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:outline-none">
          <input type="number" id="p-price" required placeholder="售價 (NT$)" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:outline-none">
          <input type="text" id="p-category" required list="category-list" placeholder="分類名稱" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:outline-none">
          <datalist id="category-list">
            <option value="聖誕節餅乾">
            <option value="11月東京連線">
          </datalist>
          <select id="p-status" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:outline-none">
            <option value="available">正常供貨中</option>
            <option value="out_of_stock">已完售/停止喊單</option>
          </select>
          <div>
            <input type="file" id="p-image-file" accept="image/*" class="text-xs w-full">
          </div>
          <div class="flex gap-2">
            <button type="submit" id="submit-btn" class="flex-1 py-2.5 bg-[#8F9E93] text-white font-bold rounded-xl text-sm shadow-sm">確認上架</button>
            <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden px-3 py-2.5 bg-[#D5D0CC] text-[#4A4543] font-bold rounded-xl text-sm">取消</button>
          </div>
        </form>
      </div>

      <!-- 管理後台篩選器 -->
      <div class="flex items-center gap-2 flex-wrap bg-[#EFECE9] p-3 rounded-2xl">
        <span class="text-xs font-bold text-[#7A726E]">篩選顯示分類：</span>
        <div id="admin-category-filters" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4" id="admin-product-grid"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, push, onValue, remove, update } from "firebase/database";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";

    const firebaseConfig = {
      apiKey: "AIzaSyD25JH9MgZtpDbOgox8vp4_bS16-3Y_fnk",
      authDomain: "butter-grocery.firebaseapp.com",
      databaseURL: "https://butter-grocery-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "butter-grocery",
      storageBucket: "butter-grocery.firebasestorage.app",
      messagingSenderId: "498008003432",
      appId: "1:498008003432:web:4ecd08d11538d03f1b3cdd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let catalog = {}, orders = [], checkedStatus = {}, localPrices = {}, purchasedQtys = {}, customProcurementOrder = [];
    let draggedProcurementKey = null;
    let activeInputKey = null;
    let activePurchasedKey = null;
    let activeStockKey = null;
    let currentAdminCategoryFilter = "全部";
    let currentProcurementCategoryFilter = "全部";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("auth-overlay").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        initListeners();
      } else {
        document.getElementById("auth-overlay").classList.remove("hidden");
        document.getElementById("admin-content").classList.add("hidden");
      }
    });

    window.handleLogin = function(e) {
      e.preventDefault();
      signInWithEmailAndPassword(auth, document.getElementById("admin-email").value, document.getElementById("admin-password").value)
        .catch(err => { document.getElementById("login-error").innerText = "登入失敗：" + err.message; });
    };

    window.handleLogout = () => signOut(auth);

    function initListeners() {
      onValue(ref(db, "catalog"), s => { catalog = s.val() || {}; renderAll(); });
      onValue(ref(db, "orders"), s => {
        const data = s.val() || {};
        orders = Object.keys(data).map(id => ({ id, ...data[id] }));
        orders.sort((a, b) => (a.orderIndex ?? a.timestamp) - (b.orderIndex ?? b.timestamp));
        renderAll();
      });
      onValue(ref(db, "procurement_status"), s => { checkedStatus = s.val() || {}; renderProcurement(); });
      onValue(ref(db, "procurement_local_prices"), s => { localPrices = s.val() || {}; renderProcurement(); });
      onValue(ref(db, "procurement_purchased_qty"), s => { 
        purchasedQtys = s.val() || {}; 
        renderProcurement(); 
        renderQueue();
      });
      onValue(ref(db, "procurement_custom_order"), s => { customProcurementOrder = s.val() || []; renderProcurement(); });
    }

    window.switchTab = function(tab) {
      ['procurement', 'queue', 'products'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-btn-${t}`).className = "flex-1 min-w-[90px] py-2 sm:py-2.5 font-bold text-xs sm:text-sm text-[#7A726E] hover:bg-[#EFECE9] rounded-xl transition-all whitespace-nowrap";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tab}`).className = "flex-1 min-w-[90px] py-2 sm:py-2.5 font-bold text-xs sm:text-sm bg-[#B08889] text-white rounded-xl shadow-sm transition-all whitespace-nowrap";
      if (tab === 'queue') renderQueue();
      if (tab === 'procurement') renderProcurement();
    };

    function renderAll() {
      renderProcurement();
      renderQueue();
      renderProducts();
    }

    function sanitizeKey(str) {
      return (str || '').replace(/[.#$/\[\]]/g, "_");
    }

    function getItemKey(name, spec) {
      const cleanName = (name || '').replace(/["']/g, '').trim();
      const cleanSpec = (spec || '').trim();
      return sanitizeKey(`${cleanName}_${cleanSpec}`);
    }

    window.toggleProcurementChecked = function(key, isChecked) {
      set(ref(db, `procurement_status/${key}`), isChecked);
    };

    window.deleteOrder = function(e, id, customerName) {
      if (e) e.stopPropagation();
      const label = customerName ? `「${customerName}」的` : '此筆';
      if (confirm(`確定要刪除${label}訂單嗎？刪除後無法復原。`)) {
        remove(ref(db, `orders/${id}`)).catch(err => {
          alert("刪除失敗：" + err.message);
        });
      }
    };

    window.deleteProduct = function(e, id, productName) {
      if (e) e.stopPropagation();
      const label = productName ? `「${productName}」` : '此商品';
      if (confirm(`確定要刪除${label}嗎？`)) {
        remove(ref(db, `catalog/${id}`)).catch(err => {
          alert("刪除失敗：" + err.message);
        });
      }
    };

    function findProductByNameAndSpec(name, spec) {
      for (const id in catalog) {
        const item = catalog[id];
        if (item.name.trim() === name.trim() && (item.spec || "").trim() === (spec || "").trim()) {
          return { id, ...item };
        }
      }
      return null;
    }

    function findProductIdByNameAndSpec(name, spec) {
      const found = findProductByNameAndSpec(name, spec);
      return found ? found.id : null;
    }

    function computeOrderAllocations() {
      const remainingPool = {};
      const hasLimit = {};

      Object.keys(purchasedQtys).forEach(k => {
        const val = purchasedQtys[k];
        if (val !== undefined && val !== null && val !== "") {
          remainingPool[k] = Math.max(0, Number(val));
          hasLimit[k] = true;
        }
      });

      return orders.map(o => {
        let originalTotal = 0;
        let allocatedTotal = 0;

        const allocatedItems = (o.items || []).map(i => {
          const key = getItemKey(i.name, i.spec);
          const reqQty = Number(i.qty || 0);
          const unitPrice = Number(i.price || 0);
          originalTotal += reqQty * unitPrice;

          let allocQty = reqQty;
          let isTracked = false;

          if (hasLimit[key]) {
            isTracked = true;
            const avail = remainingPool[key] || 0;
            allocQty = Math.min(reqQty, avail);
            remainingPool[key] = Math.max(0, avail - allocQty);
          }

          allocatedTotal += allocQty * unitPrice;

          return {
            ...i,
            key,
            reqQty,
            allocQty,
            isTracked
          };
        });

        return {
          ...o,
          allocatedItems,
          originalTotal: Number(o.totalAmount ?? originalTotal),
          allocatedTotal,
          hasAnyLimit: Object.keys(hasLimit).length > 0
        };
      });
    }

    function getEffectiveQty(key, totalDemandQty) {
      const pVal = purchasedQtys[key];
      if (pVal !== undefined && pVal !== null && pVal !== "") {
        return Number(pVal) || 0;
      }
      return totalDemandQty;
    }

    window.filterProcurementCategory = function(cat) {
      currentProcurementCategoryFilter = cat;
      renderProcurement();
    };

    window.renderProcurement = function() {
      const tbody = document.getElementById("procurement-tbody");
      const filterContainer = document.getElementById("procurement-category-filters");
      if (!tbody) return;

      if (
        (activeInputKey && document.getElementById(`input-price-${activeInputKey}`) === document.activeElement) ||
        (activePurchasedKey && document.getElementById(`input-purchased-${activePurchasedKey}`) === document.activeElement) ||
        (activeStockKey && document.getElementById(`input-stock-${activeStockKey}`) === document.activeElement)
      ) {
        return;
      }
      
      tbody.innerHTML = "";
      
      const currencySymbol = document.getElementById("currency-symbol")?.value || "JP¥";
      document.querySelectorAll(".header-curr-label").forEach(el => el.innerText = currencySymbol);

      const map = {};
      const categories = new Set(["全部"]);

      orders.forEach(o => (o.items || []).forEach(i => {
        const cleanName = (i.name || '').replace(/["']/g, '').trim();
        const cleanSpec = (i.spec || '').trim();
        const key = getItemKey(cleanName, cleanSpec);
        const regPrice = Number(i.price || 0);
        const prod = findProductByNameAndSpec(cleanName, cleanSpec);
        const category = (prod && prod.category ? prod.category.trim() : "未分類");
        categories.add(category);
        
        if (!map[key]) {
          map[key] = { name: cleanName, spec: cleanSpec, category, priceBreakdown: {}, totalQty: 0, key };
        }
        map[key].totalQty += i.qty;
        map[key].priceBreakdown[regPrice] = (map[key].priceBreakdown[regPrice] || 0) + i.qty;
      }));

      Object.keys(catalog).forEach(prodId => {
        const prod = catalog[prodId];
        const cleanName = (prod.name || '').replace(/["']/g, '').trim();
        const cleanSpec = (prod.spec || '').trim();
        const category = (prod.category ? prod.category.trim() : "未分類");
        categories.add(category);
        const key = getItemKey(cleanName, cleanSpec);
        if (!map[key]) {
          map[key] = { name: cleanName, spec: cleanSpec, category, priceBreakdown: { [prod.price || 0]: 0 }, totalQty: 0, key };
        }
      });

      if (filterContainer) {
        filterContainer.innerHTML = "";
        categories.forEach(cat => {
          const isActive = currentProcurementCategoryFilter === cat;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.innerText = cat;
          btn.onclick = () => filterProcurementCategory(cat);
          btn.className = `px-3 py-1 rounded-xl text-xs font-bold transition-all ${isActive ? 'bg-[#B08889] text-white shadow-sm' : 'bg-white text-[#7A726E] border border-[#D5D0CC]'}`;
          filterContainer.appendChild(btn);
        });
      }

      let sortedKeys = Object.keys(map);
      if (customProcurementOrder && customProcurementOrder.length > 0) {
        sortedKeys.sort((a, b) => {
          let idxA = customProcurementOrder.indexOf(a);
          let idxB = customProcurementOrder.indexOf(b);
          if (idxA === -1) idxA = 9999;
          if (idxB === -1) idxB = 9999;
          return idxA - idxB;
        });
      }

      const filteredMap = {};

      sortedKeys.forEach(k => {
        const item = map[k];
        if (currentProcurementCategoryFilter !== "全部" && item.category !== currentProcurementCategoryFilter) {
          return;
        }
        filteredMap[k] = item;

        const checked = checkedStatus[k] || false;
        const savedVal = localPrices[k];
        const currentLocalPrice = (savedVal !== undefined && savedVal !== null) ? savedVal : "";
        const numericPrice = parseFloat(currentLocalPrice) || 0;

        const savedPurchased = purchasedQtys[k];
        const currentPurchasedStr = (savedPurchased !== undefined && savedPurchased !== null) ? savedPurchased : "";
        const effectiveQty = getEffectiveQty(k, item.totalQty);
        const subtotalLocal = numericPrice * effectiveQty;

        // 取得對應商品的庫存值（若沒填或為 0 則顯示空字串並提示 0）
        const prodId = findProductIdByNameAndSpec(item.name, item.spec);
        let stockValStr = "";
        if (prodId && catalog[prodId]) {
          const s = catalog[prodId].stock;
          if (s !== undefined && s !== null && s !== "") {
            stockValStr = s;
          }
        }

        let purchasedInputStyle = "background-color: #FFFFFF; border: 1px solid #D5D0CC; color: #4A4543;";
        if (currentPurchasedStr !== "") {
          const pNum = Number(currentPurchasedStr);
          if (pNum >= item.totalQty) {
            purchasedInputStyle = "background-color: rgba(143, 158, 147, 0.18); border: 1px solid #8F9E93; color: #4E5C53;";
          } else {
            purchasedInputStyle = "background-color: rgba(176, 136, 137, 0.18); border: 1px solid #B08889; color: #6B4B4C;";
          }
        }

        const prices = Object.keys(item.priceBreakdown).sort((a, b) => Number(a) - Number(b));
        const priceBadges = prices.map(p => {
          const count = item.priceBreakdown[p];
          if (count === 0) return "";
          return `<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold bg-[#EFECE9] text-[#7A726E]">NT$${p} ×${count}</span>`;
        }).filter(Boolean).join(" ");

        const tr = document.createElement("tr");
        tr.className = `${checked ? 'bg-[#8F9E93] bg-opacity-10 line-through text-[#A39E9A]' : ''} transition-colors cursor-grab active:cursor-grabbing`;
        tr.draggable = true;
        tr.dataset.key = k;

        tr.addEventListener("dragstart", (e) => {
          draggedProcurementKey = k;
          e.dataTransfer.effectAllowed = "move";
          tr.classList.add("opacity-40");
        });

        tr.addEventListener("dragend", () => {
          tr.classList.remove("opacity-40");
          draggedProcurementKey = null;
        });

        tr.addEventListener("dragover", (e) => e.preventDefault());

        tr.addEventListener("drop", (e) => {
          e.preventDefault();
          if (draggedProcurementKey && draggedProcurementKey !== k) {
            reorderProcurement(draggedProcurementKey, k, sortedKeys);
          }
        });

        tr.innerHTML = `
          <td class="p-2 sm:p-3 text-center text-[#A39E9A]"><i class="fa-solid fa-grip-vertical text-xs sm:text-sm"></i></td>
          <td class="p-2 sm:p-3 text-center"><input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleProcurementChecked('${k}', this.checked)" class="w-4 h-4 text-[#8F9E93] rounded border-[#D5D0CC]"></td>
          <td class="p-2 sm:p-3 font-bold text-[#4A4543]">
            <div>${item.name}</div>
            <span class="inline-block mt-1 text-[10px] font-bold px-2 py-0.5 bg-[#EFECE9] text-[#7A726E] rounded-md"><i class="fa-solid fa-tag text-[9px] mr-0.5"></i>${item.category}</span>
          </td>
          <td class="p-2 sm:p-3 space-y-1">
            <div class="text-[#7A726E]">${item.spec || '-'}</div>
            <div class="flex flex-wrap gap-1">${priceBadges}</div>
          </td>
          <td class="p-2 sm:p-3 text-right font-bold text-[#7A726E]" id="qty-${k}">${item.totalQty}</td>
          <td class="p-2 sm:p-3 text-right">
            <input type="number" min="0" id="input-stock-${k}" placeholder="0 (無現貨)" value="${stockValStr}" 
              onfocus="activeStockKey='${k}'" 
              onblur="onStockBlur('${k}', '${item.name}', '${item.spec || ''}', this.value)" 
              oninput="updateProductStockByRow('${k}', '${item.name}', '${item.spec || ''}', this.value)" 
              style="background-color: #FFFFFF; border: 1px solid #D5D0CC; color: #4A4543;"
              class="w-24 p-1 rounded-lg text-right text-xs font-bold focus:outline-none">
          </td>
          <td class="p-2 sm:p-3 text-right">
            <input type="number" min="0" id="input-purchased-${k}" placeholder="未填" value="${currentPurchasedStr}" 
              onfocus="activePurchasedKey='${k}'" 
              onblur="onPurchasedBlur('${k}', this.value)" 
              oninput="updatePurchasedQty('${k}', this.value)" 
              style="${purchasedInputStyle}"
              class="w-20 p-1 rounded-lg text-right text-xs font-bold focus:outline-none">
          </td>
          <td class="p-2 sm:p-3 text-right">
            <input type="number" id="input-price-${k}" placeholder="單價" value="${currentLocalPrice}" 
              onfocus="activeInputKey='${k}'" 
              onblur="onPriceBlur('${k}', this.value)" 
              oninput="updateLocalPrice('${k}', this.value)" 
              class="w-20 p-1 bg-white border border-[#D5D0CC] rounded-lg text-right text-xs font-semibold focus:outline-none">
          </td>
          <td class="p-2 sm:p-3 text-right font-bold text-[#4A4543] whitespace-nowrap" id="subtotal-${k}">${currencySymbol} ${subtotalLocal.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });

      calculateTotals(filteredMap);
    };

    function reorderProcurement(draggedKey, targetKey, currentKeys) {
      const keys = [...currentKeys];
      const dragIdx = keys.indexOf(draggedKey);
      const targetIdx = keys.indexOf(targetKey);
      if (dragIdx < 0 || targetIdx < 0) return;
      keys.splice(dragIdx, 1);
      keys.splice(targetIdx, 0, draggedKey);
      customProcurementOrder = keys;
      set(ref(db, "procurement_custom_order"), keys);
    }

    window.calculateTotals = function(map) {
      const localTotalEl = document.getElementById("procurement-local-total");
      const twdTotalEl = document.getElementById("procurement-twd-total");
      const currencySymbol = document.getElementById("currency-symbol")?.value || "JP¥";
      const currencyRate = parseFloat(document.getElementById("currency-rate")?.value) || 0.21;
      let grandLocalTotal = 0;

      if (map) {
        Object.keys(map).forEach(k => {
          const price = parseFloat(localPrices[k]) || 0;
          const effQty = getEffectiveQty(k, map[k].totalQty);
          grandLocalTotal += price * effQty;
        });
      } else {
        Object.keys(localPrices).forEach(k => {
          const price = parseFloat(localPrices[k]) || 0;
          const qtyEl = document.getElementById(`qty-${k}`);
          if (qtyEl) {
            const demandQty = parseInt(qtyEl.innerText) || 0;
            const effQty = getEffectiveQty(k, demandQty);
            grandLocalTotal += price * effQty;
          }
        });
      }

      if (localTotalEl) localTotalEl.innerText = `${currencySymbol} ${grandLocalTotal.toLocaleString()}`;
      if (twdTotalEl) twdTotalEl.innerText = `NT$ ${Math.round(grandLocalTotal * currencyRate).toLocaleString()}`;
    };

    // 即時更新商品庫存（沒填一律視為 0）
    let stockSaveTimer = {};
    window.updateProductStockByRow = function(key, name, spec, val) {
      const numericVal = (val === "" || val === null) ? 0 : Math.max(0, parseInt(val, 10));
      const prodId = findProductIdByNameAndSpec(name, spec);
      if (prodId) {
        if (stockSaveTimer[key]) clearTimeout(stockSaveTimer[key]);
        stockSaveTimer[key] = setTimeout(() => {
          update(ref(db, `catalog/${prodId}`), { stock: numericVal });
        }, 600);
      }
    };

    window.onStockBlur = function(key, name, spec, val) {
      activeStockKey = null;
      const numericVal = (val === "" || val === null) ? 0 : Math.max(0, parseInt(val, 10));
      const prodId = findProductIdByNameAndSpec(name, spec);
      if (prodId) {
        update(ref(db, `catalog/${prodId}`), { stock: numericVal });
      }
    };

    let purchasedSaveTimer = {};
    window.updatePurchasedQty = function(key, val) {
      const numericVal = (val === "" || val === null) ? null : Math.max(0, parseInt(val, 10));
      purchasedQtys[key] = numericVal;
      calculateTotals();
      renderQueue();
      if (purchasedSaveTimer[key]) clearTimeout(purchasedSaveTimer[key]);
      purchasedSaveTimer[key] = setTimeout(() => {
        set(ref(db, `procurement_purchased_qty/${key}`), numericVal);
      }, 600);
    };

    window.onPurchasedBlur = function(key, val) {
      activePurchasedKey = null;
      const numericVal = (val === "" || val === null) ? null : Math.max(0, parseInt(val, 10));
      set(ref(db, `procurement_purchased_qty/${key}`), numericVal);
      renderQueue();
    };

    let priceSaveTimer = {};
    window.updateLocalPrice = function(key, val) {
      const numericVal = (val === "" || val === null) ? null : parseFloat(val);
      localPrices[key] = numericVal;
      calculateTotals();
      if (priceSaveTimer[key]) clearTimeout(priceSaveTimer[key]);
      priceSaveTimer[key] = setTimeout(() => {
        set(ref(db, `procurement_local_prices/${key}`), numericVal);
      }, 800);
    };

    window.onPriceBlur = function(key, val) {
      activeInputKey = null;
      const numericVal = (val === "" || val === null) ? null : parseFloat(val);
      set(ref(db, `procurement_local_prices/${key}`), numericVal);
    };

    function getPlatformBadge(platform) {
      const p = (platform || '').trim().toUpperCase();
      let bgColor = p === "THREADS" ? "#3A3837" : (p === "IG" ? "#B08889" : (p === "FB" ? "#6C7D8E" : "#8F9E93"));
      return `<span style="background-color: ${bgColor} !important; color: #FFFFFF !important;" class="px-2.5 py-1 rounded-lg text-xs font-semibold inline-block">${platform || 'LINE'}</span>`;
    }

    function renderQueue() {
      const tbody = document.getElementById("queue-tbody");
      const grandTotalEl = document.getElementById("queue-grand-total");
      if (!tbody) return;
      tbody.innerHTML = "";

      const allocatedOrders = computeOrderAllocations();
      let grandAllocatedTotal = 0;

      allocatedOrders.forEach((o, index) => {
        const details = (o.allocatedItems || []).map(i => `${i.name} ${i.spec ? '(' + i.spec + ')' : ''} x${i.reqQty}`).join("<br>");
        const contactInfo = o.phone ? `<br><span class="text-[11px] text-[#7A726E]">📞 ${o.phone}<br>🏠 ${o.address}</span>` : '';
        
        grandAllocatedTotal += o.allocatedTotal;
        const safeName = (o.customerName || '').replace(/'/g, "\\'");

        const tr = document.createElement("tr");
        tr.className = "hover:bg-white transition-colors";
        tr.innerHTML = `
          <td class="p-2 sm:p-3 text-center font-bold text-xs text-[#7A726E]">#${index + 1}</td>
          <td class="p-2 sm:p-3 text-xs text-[#7A726E]">${o.createdAtStr || ''}</td>
          <td class="p-2 sm:p-3">${getPlatformBadge(o.platform)}</td>
          <td class="p-2 sm:p-3 font-bold text-[#4A4543]">${o.customerName || ''}${contactInfo}</td>
          <td class="p-2 sm:p-3 text-xs text-[#7A726E] leading-relaxed">${details}</td>
          <td class="p-2 sm:p-3 text-right font-bold text-[#B08889]">NT$ ${o.allocatedTotal.toLocaleString()}</td>
          <td class="p-2 sm:p-3 text-center">
            <button type="button" onclick="deleteOrder(event, '${o.id}', '${safeName}')" class="p-1.5 text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      if (grandTotalEl) grandTotalEl.innerText = `NT$ ${grandAllocatedTotal.toLocaleString()}`;
    }

    window.filterAdminCategory = function(cat) {
      currentAdminCategoryFilter = cat;
      renderProducts();
    };

    window.quickChangeCategory = function(id, currentCategory) {
      let newCat = prompt("請輸入或選擇要更改的分類名稱：", currentCategory);
      if (newCat !== null) {
        newCat = newCat.trim() || "未分類";
        update(ref(db, `catalog/${id}`), { category: newCat });
      }
    };

    function renderProducts() {
      const grid = document.getElementById("admin-product-grid");
      const filterContainer = document.getElementById("admin-category-filters");
      if (!grid) return;
      grid.innerHTML = "";

      const categories = new Set(["全部"]);
      Object.values(catalog).forEach(item => {
        if (item.category) categories.add(item.category.trim());
      });

      if (filterContainer) {
        filterContainer.innerHTML = "";
        categories.forEach(cat => {
          const isActive = currentAdminCategoryFilter === cat;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.innerText = cat;
          btn.onclick = () => filterAdminCategory(cat);
          btn.className = `px-3 py-1 rounded-xl text-xs font-bold transition-all ${isActive ? 'bg-[#B08889] text-white shadow-sm' : 'bg-white text-[#7A726E] border border-[#D5D0CC]'}`;
          filterContainer.appendChild(btn);
        });
      }

      const sortedIds = Object.keys(catalog).sort((a, b) => (catalog[a].order ?? 9999) - (catalog[b].order ?? 9999));

      sortedIds.forEach(id => {
        const item = catalog[id];
        const itemCategory = (item.category || '未分類').trim();
        if (currentAdminCategoryFilter !== "全部" && itemCategory !== currentAdminCategoryFilter) return;

        // 沒填或 <= 0 一律視同無現貨 (0)
        const currentStock = (item.stock !== undefined && item.stock !== null && item.stock !== "") ? Math.max(0, Number(item.stock)) : 0;
        const isOutOfStock = item.isOutOfStock || currentStock <= 0;
        const stockText = isOutOfStock ? `無現貨 (0)` : `現貨：${currentStock}`;
        const safeProdName = (item.name || '').replace(/'/g, "\\'");

        const card = document.createElement("div");
        card.className = `border border-[#D5D0CC] rounded-2xl p-3.5 sm:p-4 bg-white space-y-3 shadow-sm flex flex-col justify-between ${isOutOfStock ? 'opacity-80' : ''}`;
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-2">
              <button type="button" onclick="quickChangeCategory('${id}', '${itemCategory}')" class="text-[11px] font-bold px-2.5 py-1 bg-[#EFECE9] text-[#7A726E] rounded-lg">
                <i class="fa-solid fa-tag text-[10px]"></i> ${itemCategory}
              </button>
              <div class="flex items-center gap-1.5">
                <span class="text-xs px-2 py-0.5 rounded-full font-bold ${isOutOfStock ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                  ${stockText}
                </span>
              </div>
            </div>
            ${item.image ? `<div class="w-full aspect-square bg-white rounded-xl mb-3 border border-[#EFECE9] overflow-hidden flex items-center justify-center p-1"><img src="${item.image}" class="w-full h-full object-contain rounded-lg"></div>` : `<div class="w-full aspect-square bg-[#EFECE9] rounded-xl flex items-center justify-center text-xs text-[#A39E9A] mb-3">無圖片</div>`}
            <div class="font-bold text-sm text-[#4A4543]">${item.name} ${item.spec ? '(' + item.spec + ')' : ''}</div>
            <div class="text-[#B08889] font-semibold text-sm mt-1">NT$ ${item.price}</div>
          </div>
          <div class="flex gap-2 pt-2 border-t border-[#EFECE9]">
            <button type="button" onclick="editProduct('${id}')" class="flex-1 py-1.5 bg-[#EFECE9] text-[#4A4543] text-xs font-bold rounded-xl">修改</button>
            <button type="button" onclick="deleteProduct(event, '${id}', '${safeProdName}')" class="flex-1 py-1.5 bg-red-50 text-red-600 text-xs font-bold rounded-xl">刪除</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function processSquareImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const targetSize = 500;
          const canvas = document.createElement("canvas");
          canvas.width = targetSize;
          canvas.height = targetSize;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, targetSize, targetSize);
          let drawWidth, drawHeight, offsetX, offsetY;
          if (img.width > img.height) {
            drawWidth = targetSize;
            drawHeight = (img.height / img.width) * targetSize;
            offsetX = 0;
            offsetY = (targetSize - drawHeight) / 2;
          } else {
            drawHeight = targetSize;
            drawWidth = (img.width / img.height) * targetSize;
            offsetX = (targetSize - drawWidth) / 2;
            offsetY = 0;
          }
          ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
          callback(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.saveProduct = function(e) {
      e.preventDefault();
      const editId = document.getElementById("edit-id").value;
      const name = document.getElementById("p-name").value.trim();
      const spec = document.getElementById("p-spec").value.trim();
      const price = Number(document.getElementById("p-price").value);
      const category = document.getElementById("p-category").value.trim() || "未分類";
      const isOutOfStock = document.getElementById("p-status").value === "out_of_stock";
      const fileInput = document.getElementById("p-image-file");

      const saveData = (imageUrl) => {
        const payload = { name, spec, price, category, isOutOfStock };
        if (imageUrl !== undefined) payload.image = imageUrl;

        if (editId) {
          update(ref(db, `catalog/${editId}`), payload).then(() => resetForm());
        } else {
          payload.image = imageUrl || "";
          payload.stock = 0; // 預設 0（無現貨），需到採購與庫存統計輸入數量
          payload.order = Object.keys(catalog).length;
          set(push(ref(db, "catalog")), payload).then(() => resetForm());
        }
      };

      if (fileInput.files && fileInput.files[0]) {
        processSquareImage(fileInput.files[0], (squareBase64) => saveData(squareBase64));
      } else {
        saveData(editId ? undefined : "");
      }
    };

    window.editProduct = function(id) {
      const item = catalog[id];
      if (!item) return;
      document.getElementById("edit-id").value = id;
      document.getElementById("p-name").value = item.name;
      document.getElementById("p-spec").value = item.spec || "";
      document.getElementById("p-price").value = item.price;
      document.getElementById("p-category").value = item.category || "未分類";
      document.getElementById("p-status").value = item.isOutOfStock ? "out_of_stock" : "available";
      document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-pen-to-square text-[#B08889]"></i> 修改商品資料`;
      document.getElementById("submit-btn").innerText = "確認修改";
      document.getElementById("cancel-edit-btn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetForm = function() {
      document.getElementById("edit-id").value = "";
      document.getElementById("p-name").value = "";
      document.getElementById("p-spec").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-category").value = "";
      document.getElementById("p-status").value = "available";
      document.getElementById("p-image-file").value = "";
      document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-gift text-[#B08889]"></i> 新增上架商品`;
      document.getElementById("submit-btn").innerText = "確認上架";
      document.getElementById("cancel-edit-btn").classList.add("hidden");
    };
  </script>
</body>
</html>
