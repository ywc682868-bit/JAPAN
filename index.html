<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奶油雜貨店 - 線上選購系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
      }
    }
  </script>
</head>
<body class="bg-[#EFECE9] min-h-screen font-sans text-[#4A4543] antialiased pb-12">

  <!-- Header -->
  <header class="bg-[#F8F6F4] border-b border-[#D5D0CC] shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#B08889]/20 rounded-xl flex items-center justify-center text-[#B08889]">
          <i class="fa-solid fa-cookie-bite text-lg"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-wide text-[#4A4543]">奶油雜貨店 Butter Store</h1>
      </div>
      <a href="manager.html" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-[#E2DEDA] hover:bg-[#D5D0CC] text-[#4A4543] transition-all flex items-center gap-1.5" title="管理登入">
        <i class="fa-solid fa-lock text-[#7A726E]"></i> 管理後台
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">
    <div id="connection-status" class="mb-6 p-3.5 rounded-2xl text-xs font-medium bg-[#8F9E93]/15 text-[#4E5C53] border border-[#8F9E93]/30 flex items-center">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i> 連線資料庫中...
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 商品目錄 (左 2 欄) -->
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-xl font-bold text-[#4A4543] flex items-center gap-2">
          <i class="fa-solid fa-gift text-[#B08889]"></i> 商品目錄
        </h2>
        <div id="customer-product-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>

      <!-- 購物車與填單 (右 1 欄) -->
      <div class="lg:col-span-1">
        <div class="bg-[#F8F6F4] rounded-3xl shadow-sm border border-[#D5D0CC] p-5 sticky top-24 space-y-4">
          <h3 class="text-lg font-bold text-[#4A4543] border-b border-[#EFECE9] pb-3 flex justify-between items-center">
            <span class="flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-[#B08889]"></i>您的選購清單</span>
            <span id="cart-item-count" class="text-xs bg-[#B08889]/20 text-[#6B4B4C] px-2.5 py-1 rounded-full font-bold">0 件</span>
          </h3>
          <div id="cart-items-list" class="space-y-2 max-h-60 overflow-y-auto divide-y divide-[#EFECE9] text-sm">
            <p class="text-[#A39E9A] text-center py-6 text-xs">尚未選擇商品</p>
          </div>
          <form onsubmit="submitCustomerOrder(event)" class="space-y-3.5 pt-3 border-t border-[#EFECE9]">
            <div>
              <label class="block text-xs font-semibold text-[#7A726E] mb-1">購買平台</label>
              <select id="cust-platform" class="w-full text-sm p-2.5 bg-white border border-[#D5D0CC] rounded-xl focus:ring-2 focus:ring-[#B08889] focus:outline-none">
                <option value="LINE">LINE</option>
                <option value="Threads">Threads</option>
                <option value="IG">Instagram</option>
                <option value="FB">Facebook</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#7A726E] mb-1">買家暱稱 / ID <span class="text-rose-500">*</span></label>
              <input type="text" id="cust-name" required placeholder="例如：Annn" class="w-full text-sm p-2.5 bg-white border border-[#D5D0CC] rounded-xl focus:ring-2 focus:ring-[#B08889] focus:outline-none">
            </div>
            <div class="bg-[#EFECE9] p-3.5 rounded-2xl flex justify-between items-center font-bold text-[#4A4543]">
              <span class="text-xs text-[#7A726E]">總金額：</span>
              <span id="cart-total-price" class="text-xl text-[#B08889]">NT$ 0</span>
            </div>
            <button type="submit" id="btn-submit-order" disabled class="w-full py-3 bg-[#B08889] hover:bg-[#9E7778] disabled:opacity-40 text-white font-bold rounded-xl shadow-sm transition-all text-sm">
              確認送出訂單
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, push, onValue } from "firebase/database";

    const firebaseConfig = {
      apiKey: "AIzaSyD25JH9MgZtpDbOgox8vp4_bS16-3Y_fnk",
      authDomain: "butter-grocery.firebaseapp.com",
      databaseURL: "https://butter-grocery-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "butter-grocery",
      storageBucket: "butter-grocery.firebasestorage.app",
      messagingSenderId: "498008003432",
      appId: "1:498008003432:web:4ecd08d11538d03f1b3cdd"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    let catalogProducts = {};
    let currentCart = {};

    onValue(ref(db, "catalog"), (snapshot) => {
      catalogProducts = snapshot.val() || {};
      renderCatalog();
      renderCart();
      const statusEl = document.getElementById("connection-status");
      statusEl.className = "mb-6 p-3.5 rounded-2xl text-xs font-medium bg-[#8F9E93]/15 text-[#4E5C53] border border-[#8F9E93]/30 flex items-center";
      statusEl.innerHTML = `<i class="fa-solid fa-wifi mr-2"></i> 已連線至資料庫`;
    });

    function renderCatalog() {
      const grid = document.getElementById("customer-product-grid");
      grid.innerHTML = "";
      Object.keys(catalogProducts).forEach(id => {
        const item = catalogProducts[id];
        const qty = currentCart[id] || 0;
        const card = document.createElement("div");
        card.className = "bg-[#F8F6F4] p-4 rounded-2xl border border-[#D5D0CC] shadow-sm flex flex-col justify-between";
        card.innerHTML = `
          <div>
            ${item.image ? `<img src="${item.image}" class="w-full h-36 object-cover rounded-xl mb-3 border border-[#EFECE9]" onerror="this.style.display='none'">` : '<div class="w-full h-36 bg-[#EFECE9] rounded-xl flex items-center justify-center text-xs text-[#A39E9A] mb-3"><i class="fa-regular fa-image mr-1"></i> 無圖片</div>'}
            <div class="flex justify-between items-start gap-2">
              <h4 class="font-bold text-[#4A4543] text-sm">${item.name}</h4>
              <span class="text-xs bg-[#EFECE9] text-[#7A726E] px-2 py-0.5 rounded-lg font-medium">${item.spec || '單一規格'}</span>
            </div>
            <p class="text-sm font-semibold text-[#B08889] mt-1.5">NT$ ${item.price}</p>
          </div>
          <div class="flex items-center justify-between mt-4 pt-3 border-t border-[#EFECE9]">
            <span class="text-xs text-[#A39E9A]">數量</span>
            <div class="flex items-center gap-2">
              <button type="button" onclick="updateCart('${id}', -1)" class="w-8 h-8 rounded-xl border border-[#D5D0CC] bg-white font-bold text-[#7A726E] hover:bg-[#EFECE9] transition-all">-</button>
              <span class="w-6 text-center font-bold text-[#4A4543] text-sm">${qty}</span>
              <button type="button" onclick="updateCart('${id}', 1)" class="w-8 h-8 rounded-xl bg-[#8F9E93] hover:bg-[#7E8D82] font-bold text-white transition-all">+</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.updateCart = function(id, change) {
      const next = (currentCart[id] || 0) + change;
      if (next <= 0) delete currentCart[id];
      else currentCart[id] = next;
      renderCatalog();
      renderCart();
    };

    function renderCart() {
      const cartList = document.getElementById("cart-items-list");
      const totalEl = document.getElementById("cart-total-price");
      const submitBtn = document.getElementById("btn-submit-order");
      cartList.innerHTML = "";
      let total = 0, count = 0;

      const keys = Object.keys(currentCart);
      if (keys.length === 0) {
        cartList.innerHTML = `<p class="text-[#A39E9A] text-center py-6 text-xs">尚未選擇商品</p>`;
        totalEl.innerText = "NT$ 0";
        submitBtn.disabled = true;
        return;
      }

      keys.forEach(id => {
        const item = catalogProducts[id];
        const qty = currentCart[id];
        total += item.price * qty;
        count += qty;
        cartList.innerHTML += `<div class="py-2.5 flex justify-between text-sm"><div><p class="font-medium text-[#4A4543]">${item.name}</p><p class="text-xs text-[#A39E9A]">${item.spec || ''} x ${qty}</p></div><span class="font-bold text-[#4A4543]">NT$ ${item.price * qty}</span></div>`;
      });

      totalEl.innerText = `NT$ ${total}`;
      document.getElementById("cart-item-count").innerText = `${count} 件`;
      submitBtn.disabled = false;
    }

    window.submitCustomerOrder = function(e) {
      e.preventDefault();
      const name = document.getElementById("cust-name").value.trim();
      if (!name) return alert("請填寫暱稱");

      const items = Object.keys(currentCart).map(id => ({
        name: catalogProducts[id].name,
        spec: catalogProducts[id].spec || "",
        price: catalogProducts[id].price,
        qty: currentCart[id]
      }));

      set(push(ref(db, "orders")), {
        platform: document.getElementById("cust-platform").value,
        customerName: name,
        items,
        totalAmount: items.reduce((sum, i) => sum + i.price * i.qty, 0),
        timestamp: Date.now(),
        createdAtStr: new Date().toLocaleString("zh-TW")
      }).then(() => {
        alert("訂單已送出！");
        currentCart = {};
        renderCatalog();
        renderCart();
      });
    };
  </script>
</body>
</html>
